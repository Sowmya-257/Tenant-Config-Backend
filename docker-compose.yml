version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moveinsync-postgres
    environment:
      POSTGRES_DB: moveinsync_config
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moveinsync_config"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - moveinsync-net

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moveinsync-config-server
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/moveinsync_config
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - moveinsync-net
    restart: on-failure

volumes:
  postgres_data:
    driver: local

networks:
  moveinsync-net:
    driver: bridge
