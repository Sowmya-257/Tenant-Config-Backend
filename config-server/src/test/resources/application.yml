server:
  port: 0

spring:
  application:
    name: moveinsync-config-server-test
  datasource:
    url: jdbc:h2:mem:configdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.moveinsync: INFO
